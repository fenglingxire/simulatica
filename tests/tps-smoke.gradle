// Run: .\gradlew.bat -I tests/tps-smoke.gradle runClient
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.gradle/tps-smoke-build'))
    project.configurations.configureEach { config ->
        if (config.name == 'runtimeOnly') config.withDependencies { deps ->
            deps.add(project.dependencies.create('net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'))
        }
    }
}
gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.sourceSets.main.java.srcDir(project.file('tests/tps-src'))
    project.tasks.named('processResources').configure {
        doLast {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def json = new groovy.json.JsonSlurper().parse(manifest)
            json.entrypoints.client.add('ml.pypals.simulatica.simulation.server.TpsSmokeTest')
            manifest.text = groovy.json.JsonOutput.toJson(json)
        }
    }
    project.tasks.named('runClient').configure {
        doFirst { project.file('run/tps-scene-result.txt').delete() }
        doLast {
            def result = project.file('run/tps-scene-result.txt').text
            if (!result.startsWith('PASS')) throw new GradleException(result)
            println result
        }
    }
}
