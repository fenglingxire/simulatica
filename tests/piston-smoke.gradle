// Run: .\gradlew.bat -I tests/piston-smoke.gradle runClient
// Uses a separate build directory; the test entrypoint never enters the release JAR.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.gradle/piston-smoke-build'))
    project.configurations.configureEach { config ->
        if (config.name == 'runtimeOnly') {
            config.withDependencies { deps ->
                deps.add(project.dependencies.create('net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'))
            }
        }
    }
}
gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.sourceSets.main.java.srcDir(project.file('tests/src'))
    project.tasks.named('processResources').configure {
        doLast {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def json = new groovy.json.JsonSlurper().parse(manifest)
            json.entrypoints.client.add('ml.pypals.simulatica.simulation.server.PistonAnimationSmokeTest')
            json.mixins.add('piston-smoke.mixins.json')
            manifest.text = groovy.json.JsonOutput.toJson(json)
            new File(destinationDir, 'piston-smoke.mixins.json').text = groovy.json.JsonOutput.toJson([
                required: true, package: 'ml.pypals.simulatica.testmixin',
                compatibilityLevel: 'JAVA_25', client: ['PistonAnimationSmokeTrace'],
                injectors: [defaultRequire: 1]
            ])
        }
    }
    project.tasks.named('runClient').configure {
        doFirst { project.file('run/piston-scene-result.txt').delete() }
        doLast {
            def result = project.file('run/piston-scene-result.txt').text
            if (!result.startsWith('PASS')) throw new GradleException(result)
            println result
        }
    }
}
