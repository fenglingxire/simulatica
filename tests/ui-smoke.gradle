// 控制面板布局回归测试
// 运行: .\gradlew.bat -I tests/ui-smoke.gradle runClient
// 用独立 build 目录；测试入口和 trace mixin 都不会进入正式 JAR。
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.gradle/ui-smoke-build'))
    project.configurations.configureEach { config ->
        if (config.name == 'runtimeOnly') {
            config.withDependencies { deps ->
                deps.add(project.dependencies.create('net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'))
            }
        }
    }
}
gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.sourceSets.main.java.srcDir(project.file('tests/ui/src'))
    project.tasks.named('processResources').configure {
        doLast {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def json = new groovy.json.JsonSlurper().parse(manifest)
            json.entrypoints.client.add('ml.pypals.simulatica.uismoke.UiLayoutSmokeTest')
            json.mixins.add('ui-smoke.mixins.json')
            manifest.text = groovy.json.JsonOutput.toJson(json)
            new File(destinationDir, 'ui-smoke.mixins.json').text = groovy.json.JsonOutput.toJson([
                required: true, package: 'ml.pypals.simulatica.uismoke.mixin',
                compatibilityLevel: 'JAVA_25', client: ['UiDrawTrace', 'UiWidgetTrace'],
                injectors: [defaultRequire: 1]
            ])
        }
    }
    project.tasks.named('runClient').configure {
        doFirst { project.file('run/ui-layout-result.txt').delete() }
        doLast {
            def result = project.file('run/ui-layout-result.txt').text
            if (!result.startsWith('PASS')) throw new GradleException(result)
            println result
        }
    }
}
